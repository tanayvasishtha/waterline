[project]
name = "waterline"
version = "0.1.0"
description = "Reads USGS river-camera staff gauges with OpenCV 5 and checks them against the official sensor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.28",
    "numpy>=2.2",
    "opencv-python-headless==5.0.0.93",
    "pydantic>=2.9",
]

[project.scripts]
waterline = "waterline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # OpenCV-style functions legitimately take many parameters
    "PLR2004",  # numeric literals in tests are expected values, not magic numbers
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
eval = [
    "matplotlib",
]

[tool.uv]
# Supply-chain hygiene: only resolve releases that are at least 7 days old at lock time.
exclude-newer = "2026-10-04T00:00:00Z"
